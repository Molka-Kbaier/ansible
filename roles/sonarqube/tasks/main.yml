---
- name: Définir les variables pour SonarQube
  set_fact:
    container_name: "sonarqube"
    image_name: "sonarqube"
    sonarqube_data_dir: "/opt/sonarqube"

- name: Vérifier si le conteneur SonarQube existe
  community.docker.docker_container_info:
    name: "{{ container_name }}"
  register: container_info
  ignore_errors: yes
  become: true

- name: Supprimer le conteneur existant
  community.docker.docker_container:
    name: "{{ container_name }}"
    state: absent
    force_kill: yes
    cleanup: yes
  when: container_info.exists
  become: true
  register: container_removed
  ignore_errors: yes


- name: Pull de l'image SonarQube
  community.docker.docker_image:
    name: "{{ image_name }}"
    source: pull
  become: true

- name: Créer les répertoires nécessaires pour SonarQube
  file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0755'
  loop:
    - "{{ sonarqube_data_dir }}/data"
    - "{{ sonarqube_data_dir }}/extensions"
    - "{{ sonarqube_data_dir }}/logs"
  become: true

- name: Démarrer le conteneur SonarQube
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ image_name }}"
    state: started
    restart_policy: always
    ports:
      - "9000:9000"
  become: true

