---
- name: Définir les variables pour Nexus
  set_fact:
    container_name: "nexus"
    image_name: "sonatype/nexus3"
    nexus_data_dir: "/opt/nexus/data"

- name: Vérifier si le conteneur Nexus existe
  community.docker.docker_container_info:
    name: "{{ container_name }}"
  register: container_info
  ignore_errors: yes
  become: true

- name: Supprimer le conteneur existant
  community.docker.docker_container:
    name: "{{ container_name }}"
    state: absent
    force_kill: yes
    cleanup: yes
  when: container_info.exists
  become: true
  ignore_errors: yes

- name: Pull de l'image Nexus
  community.docker.docker_image:
    name: "{{ image_name }}"
    source: pull
  become: true

- name: Créer le répertoire de données Nexus
  file:
    path: "{{ nexus_data_dir }}"
    state: directory
    owner: "200"
    group: "200"
  become: true

- name: Démarrer le conteneur Nexus
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ image_name }}"
    state: started
    restart_policy: always
    ports:
      - "{{ nexus_port }}:8081"
    volumes:
      - "{{ nexus_data_dir }}:/nexus-data"
    env:
      INSTALL4J_ADD_VM_PARAMS: "-Djava.util.prefs.userRoot=/nexus-data"
  become: true