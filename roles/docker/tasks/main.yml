---
# tasks file for docker
- name: Supprimer les configurations Docker existantes
  become: true
  block:
    - name: Supprimer les fichiers de dépôt Docker
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/docker.list.save

    - name: Supprimer les clés Docker existantes
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/share/keyrings/docker.gpg
        - /etc/apt/keyrings/docker.gpg

- name: Créer le répertoire pour les clés
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: 0755
  become: true
  
- name: Ajouter clé Docker
  apt_key:
    url: "https://download.docker.com/linux/ubuntu/gpg"
    state: present
  become: true

- name: Ajouter dépôt Docker
  apt_repository:
    repo: "deb [arch={{ ansible_architecture }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: "docker.list"
  become: true

- name: Installer Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
  become: true

- name: Démarrer Docker
  service:
    name: docker
    state: started
    enabled: yes
  become: true
  notify: Restart Docker

- name: Ajouter l'utilisateur au groupe docker
  user:
    name: "{{ system_user }}"
    groups: docker
    append: yes
  become: true

