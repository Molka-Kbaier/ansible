---
- name: Définir les variables pour Prometheus
  set_fact:
    prometheus_container_name: "prometheus"
    prometheus_image_name: "prom/prometheus"
    monitoring_dir: "/opt/monitoring"

- name: Vérifier si le conteneur Prometheus existe
  community.docker.docker_container_info:
    name: "{{ prometheus_container_name }}"
  register: prometheus_info
  ignore_errors: yes
  become: true

- name: Supprimer Prometheus
  community.docker.docker_container:
    name: "{{ prometheus_container_name }}"
    state: absent
    force_kill: yes
  when: prometheus_info.exists
  become: true
  ignore_errors: yes

- name: Définir les variables pour Grafana
  set_fact:
    grafana_container_name: "grafana"
    grafana_image_name: "grafana/grafana"

- name: Vérifier si le conteneur Grafana existe
  community.docker.docker_container_info:
    name: "{{ grafana_container_name }}"
  register: grafana_info
  ignore_errors: yes
  become: true

- name: Supprimer Grafana
  community.docker.docker_container:
    name: "{{ grafana_container_name }}"
    state: absent
    force_kill: yes
  when: grafana_info.exists
  become: true
  ignore_errors: yes

- name: Créer le répertoire de monitoring
  file:
    path: "{{ monitoring_dir }}"
    state: directory
  become: true

- name: Configurer Prometheus
  copy:
    dest: "{{ monitoring_dir }}/prometheus.yml"
    content: |
      global:
        scrape_interval: 15s
      
      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']
        - job_name: 'jenkins'
          metrics_path: /prometheus
          static_configs:
            - targets: ['172.17.0.1:8080']
        - job_name: 'node-exporter'
          static_configs:
            - targets: ['node-exporter:9100']
  become: true

- name: Démarrer Prometheus
  community.docker.docker_container:
    name: "{{ prometheus_container_name }}"
    image: "{{ prometheus_image_name }}"
    state: started
    restart_policy: always
    ports:
      - "9090:9090"
    volumes:
      - "{{ monitoring_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml"
  become: true

- name: Démarrer Grafana
  community.docker.docker_container:
    name: "{{ grafana_container_name }}"
    image: "{{ grafana_image_name }}"
    state: started
    restart_policy: always
    ports:
      - "3000:3000"
  become: true