---
# tasks file for monitoring
- name: Créer dossier monitoring
  file:
    path: "{{ monitoring_dir }}"
    state: directory
  become: true

- name: Configurer Prometheus
  copy:
    dest: "{{ monitoring_dir }}/prometheus.yml"
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']
        - job_name: 'node'
          static_configs:
            - targets: ['localhost:9100']
        - job_name: 'jenkins'
          metrics_path: '/prometheus'
          static_configs:
            - targets: ['jenkins:8080']
        - job_name: 'sonarqube'
          static_configs:
            - targets: ['sonarqube:9000']
  become: true

- name: Déployer stack monitoring
  copy:
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    content: |
      version: '3'
      services:
        prometheus:
          image: prom/prometheus
          container_name: prometheus
          ports:
            - "9090:9090"
          volumes:
            - {{ monitoring_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml
        grafana:
          image: grafana/grafana
          container_name: grafana
          ports:
            - "3000:3000"
          depends_on:
            - prometheus
        node-exporter:
          image: prom/node-exporter
          container_name: node-exporter
          ports:
            - "9100:9100"
  become: true

- name: Démarrer monitoring
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present
    recreate: always
    pull: 'always'
    timeout: 300
  become: true
 
